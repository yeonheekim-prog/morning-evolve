<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="모닝 퀘스트">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>모닝 퀘스트</title>
<style>
  :root{
    --bg:#0b1020; --bg2:#121a33; --panel:#151f3d; --line:#26345f; --ink:#eef2ff; --sub:#8f9cc4;
    --acc:#ff7a3d; --acc2:#ffcc4d; --ok:#38e2a0; --warn:#ff4d6d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;color:var(--ink);
    background:radial-gradient(1200px 600px at 70% -10%, #23305e 0%, transparent 60%), var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .wrap{max-width:1120px;margin:0 auto;display:grid;gap:12px;grid-template-columns:1fr}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px}
  .tag{font-size:11px;letter-spacing:2px;color:var(--sub);font-weight:800;text-transform:uppercase}

  /* HUD */
  .hud{display:flex;align-items:stretch;gap:12px;flex-wrap:wrap}
  .clockbox{padding:12px 18px;flex:1;min-width:220px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .clock{font-size:clamp(40px,7vw,64px);font-weight:900;letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums}
  .date{font-size:14px;color:var(--sub);margin-top:6px;font-weight:600}
  .gear{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:#0f1730;display:flex;align-items:center;justify-content:center}
  .gear svg{width:22px;height:22px;stroke:var(--sub)}
  .timer{padding:12px 18px;flex:1;min-width:220px}
  .tleft{font-size:clamp(28px,5vw,44px);font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px}
  .tleft small{font-size:16px;color:var(--sub);font-weight:700;margin-left:4px}
  .timer.hot .tleft{color:var(--warn)}
  .streak{padding:12px 18px;min-width:150px;display:flex;flex-direction:column;justify-content:center}
  .streak b{font-size:clamp(28px,5vw,40px);font-weight:900;color:var(--acc2)}
  .streak b small{font-size:15px;color:var(--sub);margin-left:3px}

  /* 메인 */
  .main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:12px}
  .card{position:relative;overflow:hidden;padding:14px 16px 16px;border-radius:20px;
    border:2px solid var(--tc,#ff7a3d);background:linear-gradient(160deg,#1a2650,#0e1530 70%)}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 200px at 50% 38%, var(--glow,rgba(255,122,61,.35)), transparent 70%);pointer-events:none}
  .chead{display:flex;justify-content:space-between;align-items:center;position:relative}
  .cname{font-size:clamp(22px,3.6vw,28px);font-weight:900}
  .lv{font-weight:900;font-size:15px;background:var(--tc);color:#0b1020;padding:4px 10px;border-radius:999px}
  .ctype{position:relative;font-size:13px;color:var(--sub);font-weight:700;margin-top:2px}
  .art{position:relative;display:flex;justify-content:center;margin:2px 0}
  .art svg{width:min(100%,260px);height:auto}
  .hp{position:relative;display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}
  .hpbar{flex:1;height:12px;border-radius:6px;background:#0a0f22;border:1px solid var(--line);overflow:hidden}
  .hpbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--ok),#9bffcf);transition:width .7s}
  .stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{background:#0b1229;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
  .stat span{display:block;font-size:11px;color:var(--sub);font-weight:800}
  .stat b{font-size:20px;font-variant-numeric:tabular-nums}
  .evo{position:relative;display:flex;gap:6px;margin-top:10px}
  .evo i{flex:1;height:6px;border-radius:3px;background:#22305a}
  .evo i.on{background:var(--tc)}
  .cmsg{position:relative;margin-top:8px;font-size:14px;color:var(--sub);font-weight:600;min-height:20px}

  .quests{padding:14px;display:flex;flex-direction:column;gap:10px}
  .qhead{display:flex;justify-content:space-between;align-items:baseline}
  .qhead h2{margin:0;font-size:20px;font-weight:900}
  .qhead span{color:var(--sub);font-weight:700;font-size:14px}
  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
  .q{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:16px;min-height:96px;
    background:#0f1733;border:1px solid var(--line);transition:transform .12s,border-color .3s,background .3s}
  .q:active{transform:scale(.98)}
  .qi{width:58px;height:58px;flex:none;border-radius:14px;background:#18234a;display:flex;align-items:center;justify-content:center}
  .qi svg{width:32px;height:32px;stroke:#c9d4ff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .qt{font-size:clamp(17px,2.4vw,21px);font-weight:900;word-break:keep-all}
  .qs{font-size:13px;color:var(--sub);font-weight:700;margin-top:3px}
  .q.done{border-color:var(--ok);background:linear-gradient(135deg,#0f2b2a,#0f1733)}
  .q.done .qi{background:var(--ok)}
  .q.done .qi svg{stroke:#06261a}
  .q.done .qs{color:var(--ok)}
  .q .clear{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-8deg);font-weight:900;font-size:15px;letter-spacing:2px;
    color:var(--ok);border:2px solid var(--ok);border-radius:8px;padding:2px 8px;opacity:0;transition:.3s}
  .q.done .clear{opacity:1}

  .dex{padding:12px 16px}
  .dexrow{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}
  .dx{flex:none;width:78px;text-align:center;font-size:11px;color:var(--sub);font-weight:700}
  .dx svg{width:78px;height:78px;display:block;background:#0b1229;border:1px solid var(--line);border-radius:12px}
  .empty{color:var(--sub);font-size:14px;padding:6px 0}

  /* 진화 연출 */
  .ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.18), rgba(5,8,20,.92) 60%)}
  .ov.show{display:flex}
  .ov .big svg{width:min(70vw,320px);height:auto;animation:evo 1.4s ease-out}
  @keyframes evo{0%{filter:brightness(8);transform:scale(.6)}40%{filter:brightness(5);transform:scale(1.1)}100%{filter:brightness(1);transform:scale(1)}}
  .ov h3{margin:6px 0 2px;font-size:clamp(26px,6vw,44px);font-weight:900;letter-spacing:1px}
  .ov p{margin:0;color:var(--sub);font-weight:700}
  .ov .tap{margin-top:18px;font-size:13px;color:var(--sub)}

  /* 설정 */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
  .sheet.open{display:flex}
  .sp{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
  .sp h2{margin:0 0 8px;font-size:20px}
  .sp label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px;font-weight:700}
  .sp input{width:100%;font-size:17px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0b1229;color:var(--ink)}
  .sp input + input{margin-top:6px}
  .row{display:flex;gap:8px;margin-top:16px}
  .row button{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#0b1229;font-weight:800}
  .row .pri{background:var(--acc);border-color:var(--acc);color:#1a0b00}

  @media (max-width:820px){
    .main{grid-template-columns:1fr}
    .card{max-width:520px;width:100%;justify-self:center}
  }
  @media (max-width:520px){
    .qgrid{grid-template-columns:1fr}
    .q{min-height:80px}
    .streak{flex:1}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="panel clockbox">
      <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
      <button class="gear" id="setBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="panel timer" id="timer"><div class="tag" id="tlabel">출발까지</div><div class="tleft" id="tleft">--</div></div>
    <div class="panel streak"><div class="tag">연속 클리어</div><b id="streak">0<small>일</small></b></div>
  </div>

  <div class="main">
    <div class="card" id="card">
      <div class="chead"><div class="cname" id="cname"></div><div class="lv" id="lv"></div></div>
      <div class="ctype" id="ctype"></div>
      <div class="art" id="art"></div>
      <div class="hp"><span>EXP</span><div class="hpbar"><div id="exp"></div></div><span id="expn">0/4</span></div>
      <div class="stats">
        <div class="stat"><span>공격</span><b id="sAtk">0</b></div>
        <div class="stat"><span>방어</span><b id="sDef">0</b></div>
        <div class="stat"><span>속도</span><b id="sSpd">0</b></div>
      </div>
      <div class="evo" id="evo"></div>
      <div class="cmsg" id="cmsg"></div>
    </div>

    <div class="panel quests">
      <div class="qhead"><h2>오늘의 퀘스트</h2><span id="qcount"></span></div>
      <div class="qgrid" id="qgrid"></div>
    </div>
  </div>

  <div class="panel dex">
    <div class="qhead"><h2 style="font-size:17px;margin:0">컬렉션</h2><span id="dexn"></span></div>
    <div class="dexrow" id="dex"></div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="big" id="ovArt"></div>
  <h3 id="ovTitle"></h3>
  <p id="ovSub"></p>
  <div class="tap">화면을 누르면 닫혀요</div>
</div>

<div class="sheet" id="sheet">
  <div class="sp">
    <h2>설정</h2>
    <label>트레이너 이름</label>
    <input id="sName" maxlength="10" placeholder="예: 민준">
    <label>출발 시간</label>
    <input id="sTime" type="time">
    <label>퀘스트 이름</label>
    <div id="sTasks"></div>
    <div class="row"><button id="resetToday">오늘 퀘스트 처음부터</button></div>
    <div class="row"><button id="cancel">닫기</button><button class="pri" id="save">저장</button></div>
  </div>
</div>

<script>
const KEY = 'morningEvolve_v1';
const DEFAULT_TASKS = ['아침 먹기','세수·양치','옷 입기','가방 챙기기'];
const ICONS = [
  '<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/>',
  '<rect x="9" y="10" width="6" height="12" rx="2"/><path d="M9 6h6v4H9z"/><path d="M10 2v4M12 2v4M14 2v4"/>',
  '<path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c-1 1.5-2.3 2-4 2s-3-.5-4-2z"/>',
  '<rect x="5" y="7" width="14" height="14" rx="3"/><path d="M9 7V5a3 3 0 0 1 6 0v2M5 13h14M10 13v3h4v-3"/>'
];

// 오리지널 몬스터 3계열 (이름·디자인 모두 자체 제작)
const SPECIES = [
  {id:'fire', type:'화염 · 드래곤', c1:'#ffb36b', c2:'#e8452c', c3:'#7a1d12', eye:'#ffe066', glow:'rgba(255,110,50,.45)', tc:'#ff7a3d',
   names:['봉인된 화염알','플레어','플레임혼','인페르노드','블레이즈로드']},
  {id:'water', type:'물 · 서펜트', c1:'#8fe3ff', c2:'#2b8be0', c3:'#0f3b78', eye:'#d5fbff', glow:'rgba(60,170,255,.45)', tc:'#3fb6ff',
   names:['봉인된 심해알','타이디','리플팽','타이드팽','리바이어스']},
  {id:'volt', type:'번개 · 울프', c1:'#fff08a', c2:'#f2b705', c3:'#5a3a00', eye:'#b8f7ff', glow:'rgba(255,214,40,.40)', tc:'#ffd23f',
   names:['봉인된 뇌전알','스파키','볼트팽','썬더혼','스톰킹']}
];
const MSGS = ['퀘스트 1개를 클리어하면 알이 깨어난다!','알에서 깨어났다! 다음 퀘스트로!','점점 강해지고 있다!','최종 진화까지 1개 남았다!','최종 진화 완료! 오늘의 미션 올클리어!'];
const STATS = [[0,0,0],[12,10,14],[28,24,30],[52,46,55],[88,80,92]];

// ---------- 저장 ----------
function dkey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const todayKey = () => dkey(new Date());
function load(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s||typeof s!=='object') s={};
  s.name = s.name||'';
  s.time = /^\d{2}:\d{2}$/.test(s.time||'') ? s.time : '08:40';
  if(!Array.isArray(s.tasks)||s.tasks.length!==4) s.tasks = DEFAULT_TASKS.map(n=>({name:n}));
  s.tasks = s.tasks.map((t,i)=>({name:(t&&t.name)||DEFAULT_TASKS[i]}));
  s.dex = Array.isArray(s.dex)? s.dex : [];
  if(s.day!==todayKey()){ s.day=todayKey(); s.done=[false,false,false,false]; }
  if(!Array.isArray(s.done)||s.done.length!==4) s.done=[false,false,false,false];
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
let st = load(); save();

function dayNum(k){ const p=k.split('-').map(Number); return Math.round(new Date(p[0],p[1]-1,p[2]).getTime()/86400000); }
const spToday = () => SPECIES[((dayNum(st.day)%3)+3)%3];
const stage = () => st.done.filter(Boolean).length;
function streak(){
  const set = new Set(st.dex.map(d=>d.day));
  const now = new Date(); let d = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(!set.has(dkey(d))) d.setDate(d.getDate()-1);
  let n=0; while(set.has(dkey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

// ---------- 몬스터 SVG ----------
let uid=0;
function monSVG(sp, s){
  const id='g'+(uid++);
  const defs = `<defs>
    <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sp.c1}"/><stop offset=".55" stop-color="${sp.c2}"/><stop offset="1" stop-color="${sp.c3}"/></linearGradient>
    <radialGradient id="${id}a" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${sp.c2}" stop-opacity=".55"/><stop offset="1" stop-color="${sp.c2}" stop-opacity="0"/></radialGradient>
    <radialGradient id="${id}e" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="${sp.eye}"/><stop offset="1" stop-color="${sp.c2}"/></radialGradient>
  </defs>`;
  const B=`url(#${id}b)`, O=sp.c3;
  if(s===0){
    return `<svg viewBox="0 0 200 200">${defs}
      <ellipse cx="100" cy="186" rx="48" ry="7" fill="#000" opacity=".35"/>
      <circle cx="100" cy="110" r="80" fill="url(#${id}a)"/>
      <path d="M100 28 C142 28 158 90 158 120 C158 156 132 180 100 180 C68 180 42 156 42 120 C42 90 58 28 100 28Z" fill="#1b2445" stroke="${sp.c2}" stroke-width="3"/>
      <path d="M100 40 L112 80 L96 104 L114 138 L100 168" stroke="${sp.eye}" stroke-width="4" fill="none" stroke-linejoin="round" opacity=".9"/>
      <path d="M70 70 L84 86 M132 110 L118 122 M72 140 L86 132" stroke="${sp.c2}" stroke-width="3" opacity=".8"/>
    </svg>`;
  }
  const sc=[0,.62,.76,.9,1][s];
  let back='', front='';
  // 날개(최종)
  if(s>=4) back += `<path d="M66 96 L8 40 L22 92 L2 98 L30 120 L18 140 L64 128Z" fill="${B}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M134 96 L192 40 L178 92 L198 98 L170 120 L182 140 L136 128Z" fill="${B}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>`;
  // 꼬리
  if(s>=2){
    if(sp.id==='fire') back += `<path d="M128 160 Q168 168 174 132" stroke="${sp.c2}" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M174 134 Q160 112 176 92 Q186 112 196 104 Q194 128 174 134Z" fill="${sp.eye}" stroke="#ff6a2a" stroke-width="2"/>`;
    if(sp.id==='water') back += `<path d="M128 160 Q170 172 176 140" stroke="${sp.c2}" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M176 142 L198 118 L186 146 L198 160Z" fill="${sp.c1}" stroke="${O}" stroke-width="2"/>`;
    if(sp.id==='volt') back += `<path d="M128 158 L160 150 L150 134 L182 124 L170 108 L196 96" stroke="${sp.c2}" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  // 뿔/귀
  let horns='';
  if(sp.id==='fire'){
    horns = s>=2 ? `<path d="M76 62 Q60 30 50 ${s>=3?14:30} Q72 38 86 56Z" fill="#ffe7c2" stroke="${O}" stroke-width="2.5"/><path d="M124 62 Q140 30 150 ${s>=3?14:30} Q128 38 114 56Z" fill="#ffe7c2" stroke="${O}" stroke-width="2.5"/>`
                 : `<path d="M80 60 L74 44 L90 54Z" fill="#ffe7c2" stroke="${O}" stroke-width="2"/><path d="M120 60 L126 44 L110 54Z" fill="#ffe7c2" stroke="${O}" stroke-width="2"/>`;
  } else if(sp.id==='water'){
    horns = `<path d="M100 54 L88 ${s>=3?10:30} L112 ${s>=3?22:38} L108 56Z" fill="${sp.c1}" stroke="${O}" stroke-width="2.5"/>` +
      (s>=2? `<path d="M64 84 L34 70 L44 96Z" fill="${sp.c1}" stroke="${O}" stroke-width="2.5"/><path d="M136 84 L166 70 L156 96Z" fill="${sp.c1}" stroke="${O}" stroke-width="2.5"/>`:'');
  } else {
    horns = `<path d="M74 64 L ${s>=3?54:62} ${s>=3?14:30} L90 54Z" fill="${B}" stroke="${O}" stroke-width="2.5"/><path d="M126 64 L ${s>=3?146:138} ${s>=3?14:30} L110 54Z" fill="${B}" stroke="${O}" stroke-width="2.5"/>` +
      (s>=3? `<path d="M88 52 L100 26 L112 52Z" fill="${sp.eye}" stroke="${O}" stroke-width="2"/>`:'');
  }
  // 몸통 + 다리 + 팔
  const legs = `<path d="M70 150 L62 182 L86 182 L88 156Z" fill="${B}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/><path d="M130 150 L138 182 L114 182 L112 156Z" fill="${B}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>
     <path d="M62 182 l4 -6 l4 6 l4 -6 l4 6 M114 182 l4 -6 l4 6 l4 -6 l4 6" stroke="#fff" stroke-width="2" fill="none" opacity="${s>=3?.9:0}"/>`;
  const arms = s>=3 ? `<path d="M60 112 Q38 126 42 150 L52 144 Q52 130 66 124Z" fill="${B}" stroke="${O}" stroke-width="3"/><path d="M140 112 Q162 126 158 150 L148 144 Q148 130 134 124Z" fill="${B}" stroke="${O}" stroke-width="3"/>
     <path d="M42 150 l-4 6 M47 148 l-1 8 M52 144 l2 8 M158 150 l4 6 M153 148 l1 8 M148 144 l-2 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>` : '';
  const spikes = s>=3 ? `<path d="M100 60 L92 46 L100 50 L108 46Z" fill="${sp.c1}"/>` : '';
  const body = `<path d="M100 56 C136 56 150 84 148 112 C146 146 128 164 100 164 C72 164 54 146 52 112 C50 84 64 56 100 56Z" fill="${B}" stroke="${O}" stroke-width="3.5"/>
     <path d="M100 112 C116 112 124 126 122 142 C120 154 112 160 100 160 C88 160 80 154 78 142 C76 126 84 112 100 112Z" fill="#fff" opacity=".18"/>
     <path d="M86 128 h28 M84 140 h32 M88 151 h24" stroke="${O}" stroke-width="2" opacity=".45"/>`;
  // 눈: 각진 형태, 단계 따라 날카로워짐
  const sharp = s>=3 ? 6 : (s>=2?3:0);
  const eyes = `<path d="M70 ${92-sharp} L94 ${98} L90 108 Q76 108 70 ${98}Z" fill="url(#${id}e)" stroke="${O}" stroke-width="2.5" stroke-linejoin="round"/>
     <path d="M130 ${92-sharp} L106 ${98} L110 108 Q124 108 130 ${98}Z" fill="url(#${id}e)" stroke="${O}" stroke-width="2.5" stroke-linejoin="round"/>
     <rect x="83" y="97" width="4" height="10" rx="2" fill="#0b1020"/><rect x="113" y="97" width="4" height="10" rx="2" fill="#0b1020"/>
     <path d="M92 120 L100 124 L108 120" stroke="${O}" stroke-width="3" fill="none" stroke-linecap="round"/>
     ${s>=2?`<path d="M94 121 l2 5 l2 -4 M102 122 l2 4 l2 -5" fill="#fff" stroke="none"/>`:''}`;
  const gem = s>=4 ? `<path d="M100 128 L110 138 L100 150 L90 138Z" fill="${sp.eye}" stroke="#fff" stroke-width="2"/><circle cx="100" cy="138" r="18" fill="${sp.eye}" opacity=".18"/>` : '';
  const aura = `<circle cx="100" cy="112" r="${60+s*8}" fill="url(#${id}a)" opacity="${.4+s*.15}"/>`;
  return `<svg viewBox="0 0 200 200">${defs}
    <ellipse cx="100" cy="188" rx="${30+s*8}" ry="6" fill="#000" opacity=".35"/>
    ${aura}
    <g transform="translate(100 186) scale(${sc}) translate(-100 -186)">
      ${back}${legs}${arms}${horns}${spikes}${body}${eyes}${gem}${front}
    </g></svg>`;
}

// ---------- 화면 ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function renderCard(){
  const sp=spToday(), s=stage();
  const card=$('card'); card.style.setProperty('--tc',sp.tc); card.style.setProperty('--glow',sp.glow);
  $('cname').textContent=sp.names[s];
  $('lv').textContent='Lv.'+[1,5,16,32,50][s];
  $('ctype').textContent=(st.name?st.name+'의 파트너 · ':'')+sp.type;
  $('art').innerHTML=monSVG(sp,s);
  $('exp').style.width=(s/4*100)+'%'; $('expn').textContent=s+'/4';
  const [a,d,v]=STATS[s]; $('sAtk').textContent=a; $('sDef').textContent=d; $('sSpd').textContent=v;
  $('evo').innerHTML=[1,2,3,4].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('');
  $('cmsg').textContent=MSGS[s];
}
function renderQuests(){
  $('qgrid').innerHTML=st.tasks.map((t,i)=>`
    <button class="q ${st.done[i]?'done':''}" data-i="${i}">
      <div class="qi"><svg viewBox="0 0 24 24">${ICONS[i]}</svg></div>
      <div><div class="qt">${esc(t.name)}</div><div class="qs">${st.done[i]?'+EXP 획득':'QUEST '+(i+1)}</div></div>
      <span class="clear">CLEAR</span>
    </button>`).join('');
  const s=stage(); $('qcount').textContent = s===4 ? 'ALL CLEAR' : `${s} / 4 완료`;
}
function renderDex(){
  $('streak').innerHTML=streak()+'<small>일</small>';
  $('dexn').textContent=`${st.dex.length}마리 획득`;
  const list=st.dex.slice().reverse().slice(0,60);
  $('dex').innerHTML = list.length ? list.map(d=>{
    const sp=SPECIES.find(x=>x.id===d.sp)||SPECIES[0]; const p=d.day.split('-');
    return `<div class="dx">${monSVG(sp,4)}${Number(p[1])}/${Number(p[2])}</div>`;
  }).join('') : '<div class="empty">퀘스트 4개를 모두 클리어하면 최종 진화한 몬스터가 컬렉션에 등록된다.</div>';
}
const WD=['일','월','화','수','목','금','토'];
function tick(){
  if(st.day!==todayKey()){ st=load(); save(); renderAll(); return; }
  const now=new Date();
  $('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  $('date').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일`;
  const [h,m]=st.time.split(':').map(Number);
  const dep=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0);
  const mins=Math.ceil((dep-now)/60000);
  $('timer').classList.toggle('hot', mins<=5);
  $('tlabel').textContent=`출발 ${st.time}까지`;
  $('tleft').innerHTML = mins>0 ? `${mins}<small>분 남음</small>` : '출발!';
}
function renderAll(){ renderCard(); renderQuests(); renderDex(); tick(); }

// ---------- 소리 ----------
let ac=null;
function unlock(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); }
function sfx(notes,type){
  if(!ac) return;
  notes.forEach((f,i)=>{ const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.09;
    o.type=type||'square'; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+.25);
    o.start(t); o.stop(t+.3); });
}
document.addEventListener('touchstart',unlock,{passive:true});
document.addEventListener('mousedown',unlock);

// ---------- 동작 ----------
function showEvo(s){
  const sp=spToday();
  $('ovArt').innerHTML=monSVG(sp,s);
  $('ovTitle').textContent = s===1 ? `${sp.names[1]} 등장!` : (s===4 ? `최종 진화! ${sp.names[4]}` : `${sp.names[s]}(으)로 진화!`);
  $('ovSub').textContent = s===4 ? '오늘의 퀘스트 올클리어 · 컬렉션 등록 완료' : `Lv.${[1,5,16,32,50][s]} · 공격 ${STATS[s][0]} · 방어 ${STATS[s][1]} · 속도 ${STATS[s][2]}`;
  $('ov').classList.add('show');
  if(s===4) sfx([392,523,659,784,1047,1319],'square'); else sfx([440,554,659,880],'square');
}
$('ov').addEventListener('click',()=>$('ov').classList.remove('show'));
$('qgrid').addEventListener('click',e=>{
  const b=e.target.closest('.q'); if(!b) return;
  const i=Number(b.dataset.i), before=stage();
  st.done[i]=!st.done[i];
  const after=stage();
  if(after===4 && !st.dex.some(d=>d.day===st.day)) st.dex.push({day:st.day, sp:spToday().id});
  save(); renderAll();
  if(after>before) showEvo(after);
});

function openSet(){
  $('sName').value=st.name; $('sTime').value=st.time;
  $('sTasks').innerHTML=st.tasks.map((t,i)=>`<input data-n="${i}" value="${esc(t.name)}" maxlength="12">`).join('');
  $('sheet').classList.add('open');
}
$('setBtn').onclick=openSet;
$('cancel').onclick=()=>$('sheet').classList.remove('open');
$('save').onclick=()=>{
  st.name=$('sName').value.trim();
  if(/^\d{2}:\d{2}$/.test($('sTime').value)) st.time=$('sTime').value;
  st.tasks=st.tasks.map((t,i)=>({name:document.querySelector(`[data-n="${i}"]`).value.trim()||t.name}));
  save(); $('sheet').classList.remove('open'); renderAll();
};
$('resetToday').onclick=()=>{
  if(!confirm('오늘 퀘스트 체크를 모두 지우고 알부터 다시 시작할까요? (컬렉션은 그대로예요)')) return;
  st.done=[false,false,false,false]; save(); $('sheet').classList.remove('open'); renderAll();
};

renderAll();
setInterval(tick,10000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ st=load(); renderAll(); } });
</script>
</body>
</html>
