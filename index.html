<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아침 진화">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>아침 진화</title>
<style>
  :root{
    --bg:#eef4ec; --card:#fffdf7; --ink:#2b3a2e; --sub:#6b7a6d; --line:#d7e3d3;
    --accent:#4c9a5a; --done:#ffe9a8; --doneLine:#f2c14e; --bar:#7cc68a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  button{font:inherit;color:inherit;cursor:pointer}

  /* 상단 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .clock{font-size:clamp(44px,9vw,84px);font-weight:800;letter-spacing:2px;line-height:1}
  .date{font-size:clamp(15px,2.4vw,20px);color:var(--sub);margin-top:4px}
  .topbtns{display:flex;gap:8px}
  .icon-btn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--line);
    background:var(--card);font-size:22px}

  /* 남은 시간 + 진행 */
  .status{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);
    border-radius:20px;padding:12px 16px;flex-wrap:wrap}
  .left{font-size:clamp(22px,4vw,34px);font-weight:800}
  .left small{display:block;font-size:14px;color:var(--sub);font-weight:600}
  .left.late{color:#d9534f}
  .barwrap{flex:1;min-width:180px}
  .bar{height:22px;border-radius:11px;background:#e4ece2;overflow:hidden}
  .bar>div{height:100%;width:0;background:var(--bar);border-radius:11px;transition:width .6s}
  .barlabel{font-size:14px;color:var(--sub);margin-top:6px;font-weight:600}

  /* 몬스터 */
  .mon{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);
    border-radius:24px;padding:12px 18px}
  .mon svg{width:clamp(120px,22vw,190px);height:auto;flex:none}
  .mon .name{font-size:clamp(22px,4vw,32px);font-weight:800}
  .mon .msg{font-size:clamp(15px,2.6vw,20px);color:var(--sub);margin-top:6px;line-height:1.4}
  .stages{display:flex;gap:6px;margin-top:10px}
  .stages span{width:26px;height:10px;border-radius:5px;background:#e4ece2}
  .stages span.on{background:var(--accent)}
  .wobble{animation:wob 1.6s ease-in-out infinite;transform-origin:50% 85%}
  @keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .bounce{animation:bnc 2.2s ease-in-out infinite}
  @keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* 할 일 카드 */
  .tasks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .task{position:relative;min-height:190px;border-radius:22px;border:3px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 10px;
    transition:transform .15s,background .3s,border-color .3s}
  .task:active{transform:scale(.97)}
  .task .num{position:absolute;top:10px;left:12px;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .task .emo{font-size:clamp(52px,8vw,76px);line-height:1}
  .task .lbl{font-size:clamp(18px,2.8vw,24px);font-weight:800;text-align:center;word-break:keep-all}
  .task .chk{font-size:15px;color:var(--sub);font-weight:600}
  .task.done{background:var(--done);border-color:var(--doneLine)}
  .task.done .emo{opacity:.55}
  .task.done::after{content:"✔";position:absolute;top:8px;right:12px;font-size:30px;color:#e0a100;font-weight:900}

  /* 도감 */
  .dex{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px}
  .dex h3{margin:0 0 8px;font-size:17px}
  .dexrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .dexrow .d{flex:none;text-align:center;font-size:12px;color:var(--sub)}
  .dexrow svg{width:64px;height:64px;display:block}
  .empty{color:var(--sub);font-size:14px}

  /* 진화 연출 */
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
  .flash.go{animation:fl 1.1s ease-out}
  @keyframes fl{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
  .pop{animation:pop .9s ease-out}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);z-index:60;
    background:#fff;border:4px solid var(--doneLine);border-radius:24px;padding:18px 26px;text-align:center;
    font-size:clamp(22px,4.5vw,34px);font-weight:900;opacity:0;pointer-events:none;transition:.35s;max-width:90vw}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  /* 설정 */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
  .sheet.open{display:flex}
  .panel{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
  .panel h2{margin:0 0 12px;font-size:20px}
  .panel label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px;font-weight:600}
  .panel input{width:100%;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line)}
  .trow{display:flex;gap:6px}
  .trow input:first-child{width:64px;flex:none;text-align:center}
  .prow{display:flex;gap:8px;margin-top:18px}
  .prow button{flex:1;min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700}
  .prow .primary{background:var(--accent);border-color:var(--accent);color:#fff}

  @media (max-width:760px){
    .tasks{grid-template-columns:repeat(2,1fr)}
    .task{min-height:160px}
  }
  @media (max-width:420px){
    .mon{flex-direction:column;text-align:center}
    .stages{justify-content:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="topbtns">
      <button class="icon-btn" id="setBtn" aria-label="설정">⚙️</button>
    </div>
  </div>

  <div class="status">
    <div class="left" id="left"><small>출발까지</small>--</div>
    <div class="barwrap">
      <div class="bar"><div id="bar"></div></div>
      <div class="barlabel" id="barlabel"></div>
    </div>
  </div>

  <div class="mon">
    <div id="monArt"></div>
    <div>
      <div class="name" id="monName"></div>
      <div class="msg" id="monMsg"></div>
      <div class="stages" id="stages"></div>
    </div>
  </div>

  <div class="tasks" id="tasks"></div>

  <div class="dex">
    <h3 id="dexTitle">📖 내 도감</h3>
    <div class="dexrow" id="dex"></div>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2>⚙️ 설정</h2>
    <label>아이 이름</label>
    <input id="sName" maxlength="10" placeholder="예: 민준">
    <label>출발 시간</label>
    <input id="sTime" type="time">
    <label>할 일 (그림 · 이름)</label>
    <div id="sTasks"></div>
    <div class="prow">
      <button id="resetToday">오늘 다시 시작</button>
    </div>
    <div class="prow">
      <button id="cancel">닫기</button>
      <button class="primary" id="save">저장</button>
    </div>
  </div>
</div>

<script>
const KEY = 'morningEvolve_v1';
const DEFAULT_TASKS = [
  {emo:'🍚', name:'아침 먹기'},
  {emo:'🪥', name:'세수·양치'},
  {emo:'👕', name:'옷 입기'},
  {emo:'🎒', name:'가방 챙기기'}
];

// 오리지널 몬스터 3종 — 단계 이름: 알 → 1 → 2 → 3 → 최종
const SPECIES = [
  {id:'fire', color:'#ff8a4c', dark:'#d9582a', belly:'#ffe1b8', tip:'#ffd23f',
   names:['따끈한 알','꼬마불','불똥이','불꽃룡','화염왕']},
  {id:'water', color:'#5fb3f0', dark:'#2f7fc0', belly:'#d9f0ff', tip:'#9be3ff',
   names:['촉촉한 알','물콩이','물방울이','파도리','바다왕']},
  {id:'leaf', color:'#7dcc6a', dark:'#3f9a3a', belly:'#eaffd9', tip:'#c3f06b',
   names:['파릇한 알','새싹콩','잎새리','숲도리','나무왕']}
];
const MSG = [
  '첫 번째 할 일을 하면 알이 깨어나요!',
  '알이 깨어났어요! 계속해 볼까요?',
  '쑥쑥 자라고 있어요!',
  '한 개만 더 하면 최종 진화!',
  '최종 진화 완료! 오늘 정말 멋져요 🎉'
];

// ---------- 저장 ----------
function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || typeof s!=='object') s = {};
  s.name = s.name || '';
  s.time = s.time || '08:40';
  s.tasks = Array.isArray(s.tasks) && s.tasks.length===4 ? s.tasks : DEFAULT_TASKS.map(t=>({...t}));
  s.dex = Array.isArray(s.dex) ? s.dex : [];
  if(s.day !== todayKey()){ s.day = todayKey(); s.done = [false,false,false,false]; }
  if(!Array.isArray(s.done) || s.done.length!==4) s.done = [false,false,false,false];
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
let st = load(); save();

function speciesToday(){
  const p = st.day.split('-').map(Number);
  const n = Math.floor(new Date(p[0],p[1]-1,p[2]).getTime()/86400000);
  return SPECIES[((n%3)+3)%3];
}
const stageNow = () => st.done.filter(Boolean).length;

// ---------- 몬스터 그림 ----------
function monSVG(sp, stage, cls){
  const c=sp.color, k=sp.dark, b=sp.belly, t=sp.tip;
  let g='';
  if(stage===0){
    g = `<g class="wobble"><ellipse cx="100" cy="112" rx="52" ry="66" fill="#fffaf0" stroke="${k}" stroke-width="4"/>
      <circle cx="80" cy="95" r="10" fill="${c}"/><circle cx="118" cy="130" r="13" fill="${c}"/>
      <circle cx="112" cy="78" r="7" fill="${c}"/><circle cx="78" cy="140" r="6" fill="${c}"/></g>`;
  } else {
    const s = [0,0.62,0.78,0.92,1.05][stage];
    const eyes = `<circle cx="84" cy="102" r="7" fill="#222"/><circle cx="116" cy="102" r="7" fill="#222"/>
      <circle cx="86" cy="99" r="2.5" fill="#fff"/><circle cx="118" cy="99" r="2.5" fill="#fff"/>
      <path d="M92 118 Q100 126 108 118" stroke="#222" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="72" cy="116" r="6" fill="#ff9fb0" opacity=".7"/><circle cx="128" cy="116" r="6" fill="#ff9fb0" opacity=".7"/>`;
    let extra='';
    // 2단계부터 귀/잎/지느러미
    if(stage>=2){
      if(sp.id==='fire') extra += `<path d="M62 70 L52 34 L82 60Z" fill="${c}" stroke="${k}" stroke-width="3"/><path d="M138 70 L148 34 L118 60Z" fill="${c}" stroke="${k}" stroke-width="3"/>`;
      if(sp.id==='water') extra += `<path d="M58 92 Q30 80 40 110 Q50 104 60 108Z" fill="${t}" stroke="${k}" stroke-width="3"/><path d="M142 92 Q170 80 160 110 Q150 104 140 108Z" fill="${t}" stroke="${k}" stroke-width="3"/>`;
      if(sp.id==='leaf') extra += `<path d="M100 50 Q80 20 100 10 Q120 20 100 50Z" fill="${t}" stroke="${k}" stroke-width="3"/>`;
    }
    // 3단계부터 꼬리
    let tail='';
    if(stage>=3){
      if(sp.id==='fire') tail = `<path d="M150 150 Q178 140 172 112" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M172 112 Q160 92 174 80 Q188 96 180 112Z" fill="${t}" stroke="#ff6a2a" stroke-width="2"/>`;
      if(sp.id==='water') tail = `<path d="M150 150 Q178 150 176 128" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M176 128 L190 112 L170 116 L162 104Z" fill="${t}" stroke="${k}" stroke-width="2"/>`;
      if(sp.id==='leaf') tail = `<path d="M150 150 Q176 146 178 120" stroke="${k}" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="180" cy="112" rx="10" ry="16" fill="${t}" stroke="${k}" stroke-width="2"/>`;
    }
    // 최종: 왕관 + 반짝이
    let crown='';
    if(stage>=4){
      crown = `<path d="M74 52 L82 30 L92 46 L100 24 L108 46 L118 30 L126 52Z" fill="#ffd23f" stroke="#c99400" stroke-width="3"/>
        <circle cx="100" cy="40" r="4" fill="#ff5a7a"/>
        <text x="26" y="50" font-size="22">✨</text><text x="160" y="60" font-size="18">✨</text><text x="20" y="170" font-size="16">⭐</text>`;
    }
    const feet = stage>=2 ? `<ellipse cx="80" cy="176" rx="14" ry="8" fill="${k}"/><ellipse cx="120" cy="176" rx="14" ry="8" fill="${k}"/>` : '';
    const arms = stage>=3 ? `<ellipse cx="54" cy="130" rx="9" ry="14" fill="${c}" stroke="${k}" stroke-width="3" transform="rotate(25 54 130)"/><ellipse cx="146" cy="130" rx="9" ry="14" fill="${c}" stroke="${k}" stroke-width="3" transform="rotate(-25 146 130)"/>` : '';
    g = `<g transform="translate(100 120) scale(${s}) translate(-100 -120)"><g class="bounce">
      ${tail}${extra}${feet}${arms}
      <ellipse cx="100" cy="118" rx="52" ry="58" fill="${c}" stroke="${k}" stroke-width="4"/>
      <ellipse cx="100" cy="138" rx="30" ry="28" fill="${b}"/>
      ${eyes}${crown}</g></g>`;
  }
  return `<svg viewBox="0 0 200 200" class="${cls||''}" aria-hidden="true">${g}</svg>`;
}

// ---------- 화면 ----------
const $ = id => document.getElementById(id);
function renderMon(anim){
  const sp = speciesToday(), stg = stageNow();
  $('monArt').innerHTML = monSVG(sp, stg, anim ? 'pop' : '');
  const who = st.name ? st.name+'의 ' : '';
  $('monName').textContent = who + sp.names[stg];
  $('monMsg').textContent = MSG[stg];
  $('stages').innerHTML = [1,2,3,4].map(i=>`<span class="${i<=stg?'on':''}"></span>`).join('');
}
function renderTasks(){
  $('tasks').innerHTML = st.tasks.map((t,i)=>`
    <button class="task ${st.done[i]?'done':''}" data-i="${i}">
      <span class="num">${i+1}</span>
      <span class="emo">${t.emo}</span>
      <span class="lbl">${esc(t.name)}</span>
      <span class="chk">${st.done[i]?'했어요!':'다 하면 눌러요'}</span>
    </button>`).join('');
  const n = stageNow();
  $('bar').style.width = (n/4*100)+'%';
  $('barlabel').textContent = n===4 ? '오늘 할 일 끝! 👏' : `할 일 ${n}/4 · ${4-n}개 남았어요`;
}
function renderDex(){
  const list = st.dex.slice().reverse();
  $('dexTitle').textContent = `📖 내 도감 · ${st.dex.length}마리`;
  $('dex').innerHTML = list.length ? list.slice(0,60).map(d=>{
    const sp = SPECIES.find(x=>x.id===d.sp) || SPECIES[0];
    const p = d.day.split('-');
    return `<div class="d">${monSVG(sp,4)}${Number(p[1])}/${Number(p[2])}</div>`;
  }).join('') : '<div class="empty">4개를 다 하면 오늘의 친구가 도감에 들어와요!</div>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

const WD = ['일','월','화','수','목','금','토'];
function tick(){
  const now = new Date();
  if(st.day !== todayKey()){ st = load(); save(); renderAll(); }
  $('clock').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  $('date').textContent = `${now.getMonth()+1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일`;
  const [h,m] = st.time.split(':').map(Number);
  const dep = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
  const mins = Math.ceil((dep - now)/60000);
  const el = $('left');
  el.classList.toggle('late', mins<=5);
  if(mins>0) el.innerHTML = `<small>출발(${st.time})까지</small>${mins}분 남았어요`;
  else el.innerHTML = `<small>출발 시간 ${st.time}</small>출발할 시간이에요!`;
}
function renderAll(){ renderMon(false); renderTasks(); renderDex(); tick(); }

// ---------- 소리 (iOS: 첫 터치 후에만) ----------
let ac = null;
function unlock(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); }
function chime(notes){
  if(!ac) return;
  notes.forEach((f,i)=>{
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+i*0.12;
    o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
    o.start(t); o.stop(t+0.4);
  });
}
document.addEventListener('touchstart', unlock, {passive:true});
document.addEventListener('mousedown', unlock);

// ---------- 동작 ----------
let toastT;
function toast(txt){
  const t=$('toast'); t.textContent=txt; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2200);
}
$('tasks').addEventListener('click', e=>{
  const btn = e.target.closest('.task'); if(!btn) return;
  const i = Number(btn.dataset.i);
  const before = stageNow();
  st.done[i] = !st.done[i];
  const after = stageNow();
  if(after===4 && !st.dex.some(d=>d.day===st.day)) st.dex.push({day:st.day, sp:speciesToday().id});
  save();
  renderTasks();
  if(after>before){
    const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    setTimeout(()=>{
      renderMon(true);
      const nm = speciesToday().names[after];
      if(after===4){ chime([523,659,784,1047,1319]); toast(`🎉 ${nm}(으)로 최종 진화!`); renderDex(); }
      else if(after===1){ chime([523,659,784]); toast(`알이 깨어났어요! ${nm}!`); }
      else { chime([587,740,880]); toast(`✨ ${nm}(으)로 진화했어요!`); }
    }, 280);
  } else {
    renderMon(false);
  }
});

// 설정
function openSet(){
  $('sName').value = st.name; $('sTime').value = st.time;
  $('sTasks').innerHTML = st.tasks.map((t,i)=>`<div class="trow" style="margin-bottom:6px">
    <input data-e="${i}" value="${esc(t.emo)}" maxlength="4"><input data-n="${i}" value="${esc(t.name)}" maxlength="12"></div>`).join('');
  $('sheet').classList.add('open');
}
$('setBtn').onclick = openSet;
$('cancel').onclick = ()=>$('sheet').classList.remove('open');
$('save').onclick = ()=>{
  st.name = $('sName').value.trim();
  if(/^\d{2}:\d{2}$/.test($('sTime').value)) st.time = $('sTime').value;
  st.tasks = st.tasks.map((t,i)=>({
    emo: document.querySelector(`[data-e="${i}"]`).value.trim() || t.emo,
    name: document.querySelector(`[data-n="${i}"]`).value.trim() || t.name
  }));
  save(); $('sheet').classList.remove('open'); renderAll();
};
$('resetToday').onclick = ()=>{
  if(!confirm('오늘 체크를 모두 지우고 알부터 다시 시작할까요? (도감은 그대로예요)')) return;
  st.done = [false,false,false,false]; save(); $('sheet').classList.remove('open'); renderAll();
};

renderAll();
setInterval(tick, 10000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ st = load(); renderAll(); } });
</script>
